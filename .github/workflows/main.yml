name: Main

on:
  push:
    # branches:
    #   - main

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate artifact randomly
        id: gen_artifact
        run: |
          minute=$(date +%M)
          if [ $((10#$minute % 2)) -eq 0 ]; then
            date > updated.log
            echo "Artifact generated"
            echo "generated=true" >> $GITHUB_OUTPUT
          else
            echo "No artifact generated"
            echo "generated=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload artifact if generated
        if: steps.gen_artifact.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-log
          path: updated.log
      - name: List artifacts of current run
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            const artifactNames = artifacts.map(a => a.name).join(", ");
            core.notice(`Found ${artifacts.length} artifacts: ${artifactNames}.`);
